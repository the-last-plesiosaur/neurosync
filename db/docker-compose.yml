services:
  postgres:
    image: postgres:18
    container_name: postgres-local
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - /opt/postgres:/var/lib/postgresql

    networks:
      - postgres-network

networks:
  postgres-network:
    name: postgres-local-network
    driver: bridge
